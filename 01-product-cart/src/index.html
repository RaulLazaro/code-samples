<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Product Cart — Angular 8</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    .reset-demo {
      position: fixed; right: 16px; bottom: 16px; z-index: 9999;
      font: 13px/1 system-ui, sans-serif; color: #1b1f23; background: #fff;
      border: 1px solid #d0d7de; border-radius: 999px; padding: 8px 14px;
      cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }
    .reset-demo:hover { border-color: #0969da; color: #0969da; }
  </style>
</head>
<body>
  <app-root></app-root>
  <button class="reset-demo" type="button" id="reset-demo">Reset demo</button>
  <script>
    document.getElementById('reset-demo').addEventListener('click', function () {
      localStorage.removeItem('cartData')
      location.reload()
    })
  </script>
</body>
</html>
